site_name: H3 Patterns
site_url: https://h3.zqmlabs.com/
site_description: H3 hexagonal grid tutorials for spatial indexing, point-to-cell conversion, aggregation, visualization, resolution comparisons, and DuckDB integration.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/h3-cookbook

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - meta
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
