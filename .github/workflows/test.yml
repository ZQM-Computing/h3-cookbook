name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          timeout 300s python -m pip install --retries 2 --timeout 20 -e . pytest
      - name: Run tests
        run: |
          if [ -f "pytest.ini" ] || [ -f "pyproject.toml" ]; then
            python -m pytest
          elif [ -d "tests" ]; then
            python -m pytest tests/
          else
            echo "No test suite found — running basic validation"; ls -la; find . -name "*.py" -o -name "*.js" -o -name "*.sh" | head -20
          fi
